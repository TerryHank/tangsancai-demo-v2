    <script>
        // --- AUDIO SYNC UTILITIES ---
        let globalAudioPlayer = null;
        
        function getAudioForVideo(videoSrc) {
            if (!videoSrc) return null;
            // Extract filename without path and extension
            const filename = videoSrc.split('/').pop().split('.').shift();
            
            let mapped = filename.replace('_special', '');
            
            // 1. Map character-specific filenames to generic 'color' equivalents
            const colors = ['red', 'blue', 'black', 'white', 'gray'];
            colors.forEach(color => {
                if (mapped === `${color}_dance`) mapped = 'color_dance';
                if (mapped === `${color}_to_big`) mapped = 'color_to_big';
                if (mapped === `stripe_to_${color}`) mapped = 'stripe_to_color';
                if (mapped === `reveal_${color}`) mapped = 'reveal_color';
                if (mapped === `${color}_outro`) mapped = 'color_outro';
            });
            
            // 2. Map curtain opening to curtain
            if (mapped === 'curtain') {
                mapped = 'curtain';
            }

            
            // 3. Alias mappings for silent videos (reuse existing audios)
            if (mapped === 'reveal_color') {
                mapped = 'curtain'; // Reuse curtain.mp3 for reveal
            }
            if (mapped === 'color_outro') {
                mapped = 'stripe_to_color'; // Reuse stripe_to_color.mp3 for outro
            }
            
            const AVAILABLE_AUDIOS = [
                'big_flower_to_round',
                'blue_flower_to_stripe',
                'color_dance',
                'color_to_big',
                'curtain',
                'intro',
                'round_to_blue_flower',
                'stripe_to_color'
            ];
            
            if (AVAILABLE_AUDIOS.includes(mapped)) {

        function syncAudioWithVideo(videoSrc, loop = false, seekTime = 0, speed = 1.0) {
            if (!globalAudioPlayer) {
                globalAudioPlayer = document.getElementById('globalBgmPlayer');
            }
            if (!globalAudioPlayer) return;
            
            const audioSrc = getAudioForVideo(videoSrc);
            if (audioSrc) {
                // If this BGM is already playing, let it continue without restarting!
                if (globalAudioPlayer.src && globalAudioPlayer.src.includes(audioSrc) && !globalAudioPlayer.paused) {
                    console.log(`[Audio Sync] BGM ${audioSrc} is already playing. Continuing...`);
                    globalAudioPlayer.loop = loop;
                    globalAudioPlayer.playbackRate = speed;
                    return;
                }
                console.log(`[Audio Sync] Playing BGM: ${audioSrc} (loop=${loop}, seek=${seekTime}s, speed=${speed}x)`);
                globalAudioPlayer.src = audioSrc;
                globalAudioPlayer.loop = loop;
                globalAudioPlayer.volume = 0.6;
                globalAudioPlayer.currentTime = seekTime;
                globalAudioPlayer.playbackRate = speed; // Sync audio playback speed
                playBackgroundAudio();
            } else {
                console.log(`[Audio Sync] No matching BGM for ${videoSrc}. Stopping audio.`);
                globalAudioPlayer.pause();
                globalAudioPlayer.removeAttribute('src');
                document.getElementById('enableSound').hidden = true;
            }
        }

            const button = document.getElementById('enableSound');

        function playSeamlessVideo(src, loop = false, blendMode = 'normal', onendedCallback = null, freezeTimeRemaining = 0.06) {
            return new Promise((resolve, reject) => {
                const playerA = document.getElementById('videoPlayerA');
                const playerB = document.getElementById('videoPlayerB');
                if (!playerA || !playerB) { 
                    console.error("[Video System 🚨] Missing videoPlayerA or videoPlayerB elements!");
                    resolve(); 
                    return; 
                }
                
                const nextPlayer = (activePlayer === playerA) ? playerB : playerA;
                const prevPlayer = activePlayer;
                
                console.log(`[Video Loading 🎥] Switching source -> ${src} (loop: ${loop}, blend: ${blendMode})`);
                
                // Keep nextPlayer completely transparent while loading in background
                nextPlayer.style.opacity = '0';
                nextPlayer.classList.remove('opacity-100');
                nextPlayer.classList.add('opacity-0');
                
                if (!nextPlayer.src || !nextPlayer.src.includes(src) || nextPlayer.error || nextPlayer.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
                    nextPlayer.src = src;
                    nextPlayer.load();
                }
                nextPlayer.loop = loop;
                nextPlayer.style.mixBlendMode = blendMode;
                nextPlayer.currentTime = 0;
                nextPlayer.playbackRate = 1.0; // Reset playback rate
                nextPlayer.ontimeupdate = null; // Clear old listeners
                nextPlayer.onended = null;
                
                // Mute all videos by default to avoid browser restrictions, EXCEPT special Easter egg videos!
                if (src.includes('_special.mp4')) {
                    console.log(`[Video System] Unmuting special video: ${src}`);
                    nextPlayer.muted = false;
                    nextPlayer.volume = 1.0;
                } else {
                    nextPlayer.muted = true;
                }
                
                let isFinished = false;
                const finish = () => {
                    if (!isFinished) {
                        isFinished = true;
                        resolve();
                    }
                };

                nextPlayer.onplaying = function() {
                    console.log(`[Video Loading ✅] Video playing & fading in: ${src} (Player: ${nextPlayer.id})`);
                    nextPlayer.classList.remove('opacity-0');
                    nextPlayer.classList.add('opacity-100');
                    nextPlayer.style.opacity = '1';
                    
                    // Sync audio BGM
                    syncAudioWithVideo(src, loop);
                    
                    // Always hide static stage image once active video begins rendering
                    const stageImg = document.getElementById('stageFigurineImg');
                    if (stageImg) {
                        stageImg.classList.remove('opacity-100');
                        stageImg.classList.add('opacity-0', 'hidden');
                        stageImg.style.opacity = '0';
                    }

                    // Smoothly fade out curtain overlay (e.g. after curtain_close completes)
                    const curtainOverlay = document.getElementById('curtainOverlayPlayer');
                    if (curtainOverlay && parseFloat(curtainOverlay.style.opacity) > 0 && !src.includes('curtain.mp4')) {
                        curtainOverlay.style.transition = 'opacity 500ms ease-in-out';
                        curtainOverlay.style.opacity = '0';
                        setTimeout(() => { try { curtainOverlay.pause(); } catch(e){} }, 500);
                    }
                    
                    // Only hide previous player AFTER next player has rendered active frames!
                    if (prevPlayer && prevPlayer !== nextPlayer) {
                        setTimeout(() => {
                            prevPlayer.classList.remove('opacity-100');
                            prevPlayer.classList.add('opacity-0');
                            prevPlayer.style.opacity = '0';
                            try {
                                prevPlayer.pause();
                                prevPlayer.removeAttribute('src');
                                prevPlayer.load();
                            } catch(e){}
                        }, 120);
                    }
                    nextPlayer.onplaying = null;
                };
                
                if (!loop) {
                    const onEndedFallback = () => {
                        nextPlayer.ontimeupdate = null;
                        nextPlayer.onended = null;
                        console.log(`[Video Loading 🏁] Video ended (native ended event): ${src}`);
                        try {
                            nextPlayer.currentTime = Math.max(0, nextPlayer.duration - freezeTimeRemaining);
                            nextPlayer.playbackRate = 0.1;
                        } catch(e) {
                            console.warn("Failed to seek back on ended fallback:", e);
                        }
                        if (onendedCallback) onendedCallback();
                        finish();
                    };
                    nextPlayer.onended = onEndedFallback;

                    let targetLogFired = false;
                    nextPlayer.ontimeupdate = function() {
                        if (!window.lastPlayProgressLog || Date.now() - window.lastPlayProgressLog > 1000) {
                            console.log(`[Play Progress] ${src}: current=${nextPlayer.currentTime.toFixed(2)}, duration=${nextPlayer.duration.toFixed(2)}, paused=${nextPlayer.paused}, speed=${nextPlayer.playbackRate}`);
                            window.lastPlayProgressLog = Date.now();
                        }
                        if (nextPlayer.duration > 0.5 && nextPlayer.currentTime >= nextPlayer.duration - freezeTimeRemaining) {
                            nextPlayer.ontimeupdate = null;
                            nextPlayer.onended = null;
                            nextPlayer.playbackRate = 0.1;
                            console.log(`[Video Loading 🏁] Video ended (frozen on last frame): ${src}`);
                            if (onendedCallback) onendedCallback();
                            finish();
                        }
                    };
                }
                
                activePlayer = nextPlayer;
                nextPlayer.play().then(() => {
                    console.log(`[Video Loading ▶️] Play promise resolved for: ${src}`);
                    if (loop) finish();
                }).catch(e => {
                    console.warn(`[Video Loading ⚠️] Play failed with audio for ${src}, retrying muted fallback:`, e);
                    nextPlayer.muted = true;
                    nextPlayer.play().then(() => {
                        if (loop) finish();
                    }).catch(err => {
                        console.error("Fatal play error:", err);
                        finish();
                    });
                });
            });
        }

        // ================= DYNAMIC GOLD DUST SPARKS & EMBERS CANVAS =================
        let blessingSparksAnimId = null;
        function startBlessingSparks() {
            const canvas = document.getElementById('blessingSparksCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement?.offsetWidth || window.innerWidth;
            canvas.height = canvas.parentElement?.offsetHeight || window.innerHeight;
            
            const sparks = [];
            const colors = ['#ffffff', '#f2f7ff', '#e6f0ff', '#ffffff', '#d9e6ff', '#ffffff'];
            
            for (let i = 0; i < 50; i++) {
                sparks.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height * 0.4 + Math.random() * (canvas.height * 0.6),
                    radius: Math.random() * 2.8 + 1.2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -(Math.random() * 1.8 + 0.8),
                    alpha: Math.random() * 0.8 + 0.2,
                    pulse: Math.random() * 0.04 + 0.02
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                sparks.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.alpha += Math.sin(Date.now() * s.pulse) * 0.02;
                    s.alpha = Math.max(0.1, Math.min(1.0, s.alpha));
                    
                    if (s.y < 0 || s.x < 0 || s.x > canvas.width) {
                        s.x = Math.random() * canvas.width;
                        s.y = canvas.height;
                        s.alpha = Math.random() * 0.8 + 0.2;
                    }
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = s.alpha;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = s.color;
                    ctx.fill();
                    ctx.restore();
                });
                
                blessingSparksAnimId = requestAnimationFrame(animate);
            }
            
            if (blessingSparksAnimId) cancelAnimationFrame(blessingSparksAnimId);
            animate();
        }
        
        function stopBlessingSparks() {
            if (blessingSparksAnimId) {
                cancelAnimationFrame(blessingSparksAnimId);
                blessingSparksAnimId = null;
            }
            const canvas = document.getElementById('blessingSparksCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        async function triggerMainDance() {

        async function triggerSpinTransition() {
            currentState = AppState.SPIN_LOOPING;
            if (mocap) {
                mocap.isPoseTriggerMode = false; // Disable gesture trigger while video is playing
                mocap.matchStartTime = null;
            }
            
            const matchedId = window.matchedFigurineId || 'white';
            
            // 5-step continuous material transition loop:
            // 0: {color}_to_big -> 1: big_flower_to_round -> 2: round_to_blue_flower -> 3: blue_flower_to_stripe -> 4: stripe_to_{color} -> loop!
            const step = spinVideoIndex % 5;
            let spinVideoSrc = "";
            if (step === 0) {
                spinVideoSrc = `video/${matchedId}_to_big.mp4`;
            } else if (step === 1) {
                spinVideoSrc = (window.specialStepIndex === 1) ? "video/big_flower_to_round_special.mp4" : "video/big_flower_to_round.mp4";
            } else if (step === 2) {
                spinVideoSrc = (window.specialStepIndex === 2) ? "video/round_to_blue_flower_special.mp4" : "video/round_to_blue_flower.mp4";
            } else if (step === 3) {
                spinVideoSrc = (window.specialStepIndex === 3) ? "video/blue_flower_to_stripe_special.mp4" : "video/blue_flower_to_stripe.mp4";
            } else if (step === 4) {
                spinVideoSrc = `video/stripe_to_${matchedId}.mp4`;
            }
            if (step === 4) {
                const banner = document.getElementById('huxuanPromptBanner');
                if (banner) {
                    banner.innerText = "体验结束，感谢您的参与";
                }
            }
            
            console.log(`[State Machine] Playing spin transition video (Step ${step + 1}/5): ${spinVideoSrc}`);
            
            // Fade out the prompt temporarily while the video plays
            const promptMat = document.getElementById('promptMaterialImg');
            if (promptMat) { 
                promptMat.classList.remove('opacity-100'); 
                setTimeout(() => promptMat.classList.add('hidden'), 500);
            }
            
            const showMatPromptCallback = () => {
                const step = spinVideoIndex % 5;
                if (step === 4) {
                    console.log("[State Machine] Step 5/5 transition video finished (stripe_to_color) -> Loop cancelled. Freezing for 1s before OUTRO...");
                    spinVideoIndex = 0; // Reset index
                    currentState = AppState.WAITING_FOR_OUTRO_DELAY;
                    
                    window.outroDelayTimer = setTimeout(() => {
                        console.log("[State Machine] 1s freeze finished. Triggering OUTRO.");
                        playOutroVideo();
                    }, 1000);
                    return; // Exit early
                }
                
                if (promptMat) {
                    promptMat.classList.remove('hidden');
                    void promptMat.offsetWidth;
                    promptMat.classList.add('opacity-100');
                }
                
                spinVideoIndex++;
                
                // Pause at end frame, DO NOT AUTO-LOOP. Require user to perform spread arms gesture again!
                console.log(`[State Machine] Material video finished and frozen on last frame. Waiting for next spread arms gesture.`);
                currentState = AppState.WAITING_FOR_SPIN_RESUME;
                syncAudioWithVideo(null);
                
                if (mocap) {
                    mocap.activePoseKey = 'spread_arms';
                    mocap.matchStartTime = null;
                    mocap.isPoseTriggerMode = true;
                }
                
                // If user leaves or stays still for 5 seconds after transition, proceed to outro
                window.spinResumeTimer = setTimeout(() => {
                    if (currentState === AppState.WAITING_FOR_SPIN_RESUME || currentState === AppState.WAITING_FOR_SPIN) {
                        console.log(`[State Machine] 5s elapsed without raising hands. Triggering outro.`);
                        playOutroVideo();
                    }
                }, 5000);
            };
            
            try {
                await playSeamlessVideo(spinVideoSrc, false, 'normal', showMatPromptCallback);
            } catch (e) {
                console.error("[State Machine] Play failed:", e);
            }
            console.log(`[State Machine] Spin video ${spinVideoIndex} ended. Paused on last frame.`);
        }

        function receiveColorFrame(frame, image) {
            const previous = previewUrl;
            previewUrl = URL.createObjectURL(image);
            webcamElement.src = previewUrl;
            if (previous) URL.revokeObjectURL(previous);

            if (currentState !== AppState.STANDBY_LOOP || window.isColorLocked ||
                frame.bodyId == null || !frame.colorJoints) return;
            if (colorBody !== frame.bodyId) {
                colorBody = frame.bodyId;
                colorRound++;
                colorSamples = [];
                window.matchedFigurineId = 'white';
                updateMuseumInfoCard(FIGURINES_DB.white);
            }
            const joints = frame.colorJoints;
            const required = ['leftShoulder', 'rightShoulder', 'leftHip', 'rightHip'];
            if (!colorWorkerReady || colorWorkerBusy || !required.every(name => joints[name])) return;
            colorWorkerBusy = true;
            colorWorker.postMessage({ frameId: frame.frameId, round: colorRound, image, joints });
        }

        function acceptColorSample({ data }) {
            if (data.ready) {
                colorWorkerReady = true;
                return;
            }
            colorWorkerBusy = false;
            if (data.error) {
                console.error('[Clothing segmentation]', data.error);
                return;
            }
            if (data.round !== colorRound || currentState !== AppState.STANDBY_LOOP ||
                window.isColorLocked || !data.result) return;

            const { histogram, pixels } = data.result;
            const classified = Object.values(histogram).reduce((sum, count) => sum + count, 0);
            if (pixels < 64 || classified < pixels / 2) return;
            colorSamples.push(histogram);
            if (colorSamples.length > 5) colorSamples.shift();
            const totals = Object.entries(histogram).map(([color]) => [
                color, colorSamples.reduce((sum, sample) => sum + sample[color], 0)
            ]);
            totals.sort((a, b) => b[1] - a[1]);
            const [color] = totals[0];
            const figurine = matchFigurineByColor(color);
            if (window.matchedFigurineId === figurine.id) return;
            window.matchedFigurineId = figurine.id;
            updateMuseumInfoCard(figurine);
            document.getElementById('stageFigurineImg').src = figurine.reveal0sImage;
            console.info('[Clothing color]', color, JSON.stringify(histogram), 'frame', data.frameId);
        }

        function createMocapEngine() {
            if (mocap) return;
            const status = document.getElementById('sensorStatus');
            const names = { azure: 'Azure Kinect DK', v2: 'Kinect v2', mock: '模拟 Kinect' };
            mocap = new MotionCaptureEngine({
                onFrame: receiveColorFrame,
                onStatus(state, device, detail) {
                    const label = state === 'connected' ? names[device] : '等待 Kinect';
                    if (status.textContent !== label) status.textContent = label;
                    if (status.title !== (detail || '')) status.title = detail || '';
                    if (state !== 'connected' && previewUrl) {
                        webcamElement.removeAttribute('src');
                        URL.revokeObjectURL(previewUrl);
                        previewUrl = undefined;
                    }
                }
            });
            initializeMocapCallbacks();
            mocap.start();
        }

        function initializeMocapCallbacks() {
            if (!mocap) return;
            
            mocap.onPoseScore = function(score) {
                if (currentState === AppState.STANDBY_WAIT) {

                    console.log(`[USER TRIGGER 🟢] User triggered: Raise Hand (for Awaken / optimal_1)`);
                    triggerMainDance();
                }
            };
        }

        /**
         * Synthesizes a beautiful chime sound using Web Audio API
         */
        function playChimeEffect() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.3); // E6
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.55);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {
                console.warn("Failed to play Web Audio chime:", e);
            }
        }

        }
